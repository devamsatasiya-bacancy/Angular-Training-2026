<div class="book-card" [class.book-card-editing]="isEditing">

  <img class="book-card-image" [src]="book.image" [alt]="book.title" />

  <div class="book-card-body">
    <h3 class="book-card-title">{{ book.title }}</h3>
    <p class="book-card-author">{{ book.author }}</p>
    <p class="book-card-price">{{ book.price }}</p>
  </div>

  <div class="book-card-actions">
    @if (!isEditing) {
      <button class="btn btn-outline" (click)="onEdit()">Edit</button>
    }
    <button class="btn btn-danger" [disabled]="isEditing" (click)="onDelete()">Delete</button>
    <button class="btn btn-ghost" (click)="toggleMore()">
      {{ showMore() ? 'View Less' : 'View More' }}
    </button>
  </div>

  @if (showMore()) {
    <div class="book-card-more">
      <p>{{ book.description }}</p>
    </div>
  }

</div>
