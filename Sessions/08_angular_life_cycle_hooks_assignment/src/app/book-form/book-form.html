<div class="book-form">
  <input class="book-form-input" type="text" placeholder="Title" [(ngModel)]="title" name="title" />
  <input class="book-form-input" type="text" placeholder="Author" [(ngModel)]="author" name="author" />
  <input class="book-form-input" type="number" placeholder="Price" [(ngModel)]="price" name="price" />
  <input class="book-form-input" type="text" placeholder="Description" [(ngModel)]="description" name="description" />
</div>
