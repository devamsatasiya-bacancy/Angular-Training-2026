<div class="book-form">
  <input class="book-form__input" type="text" placeholder="Title" [(ngModel)]="title" name="title" />
  <input class="book-form__input" type="text" placeholder="Author" [(ngModel)]="author" name="author" />
  <input class="book-form__input" type="number" placeholder="Year" [(ngModel)]="year" name="year" />
  <input class="book-form__input" type="text" placeholder="Description" [(ngModel)]="description" name="description" />
</div>
