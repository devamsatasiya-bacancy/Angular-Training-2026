F<section aria-labelledby="login-heading">
  <h1 id="login-heading">Login</h1>

  @if (isAuthenticated()) {
    <p>You are already logged in.</p>
    <p><a routerLink="/posts">Go to posts</a></p>
  } @else {
    <form [formGroup]="loginForm" (ngSubmit)="submit()">
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" />
      </div>

      <div>
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" />
      </div>

      <button type="submit">Login</button>
    </form>

    <section aria-labelledby="demo-users-heading">
      <h2 id="demo-users-heading">Demo Users</h2>

      <ul>
        @for (user of demoUsers(); track user.id) {
          <li>{{ user.name }} - {{ user.email }} / password123</li>
        }
      </ul>
    </section>
  }
</section>
