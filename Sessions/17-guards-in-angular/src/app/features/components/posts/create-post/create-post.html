<section aria-labelledby="create-post-heading">
  <h1 id="create-post-heading">Create Post</h1>
  <p><a routerLink="/posts">Back to posts</a></p>

  <form [formGroup]="createPostForm" (ngSubmit)="submit()">
    <div>
      <label for="title">Title</label>
      <input id="title" type="text" formControlName="title" />
    </div>

    <div>
      <label for="content">Content</label>
      <textarea id="content" formControlName="content"></textarea>
    </div>

    <button type="submit">Create Post</button>
  </form>

  @if (hasUnsavedChanges()) {
    <p>You have unsaved changes.</p>
  }
</section>
