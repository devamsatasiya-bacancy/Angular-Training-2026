<div class="social-media-feed">

    <div class="toggle-feed">

        <button (click)="toggleRefreshing()"> 
            {{ isFeedRereshing() ? 'Stop Refreshing' : 'Start Refreshing' }}
        </button>
        <p>{{ toastMessage() }}</p>
    </div>

    <p>Total Likes: {{ getTotalLikes() }}</p>
    @for (smpost of socialMediaPosts(); track $index) {
        
        <app-social-media-post (postLiked)="updatePostLikes($event)" [postData]="smpost"></app-social-media-post>
    }
</div>
