@if (toastService.toasts().length) {
  <section aria-label="Notifications" aria-live="polite">
    @for (toast of toastService.toasts(); track toast.id) {
      <div>
        <p>{{ toast.type | titlecase }}: {{ toast.message }}</p>
        <button type="button" (click)="toastService.dismiss(toast.id)">
          Dismiss
        </button>
      </div>
    }
  </section>
}
